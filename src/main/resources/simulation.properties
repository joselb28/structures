# =====================================================================
#  CarNBus — scénario de simulation : VALEURS PAR DÉFAUT
#
#  Pour essayer d'autres valeurs, ne modifiez pas ce fichier : créez un
#  scénario dans src/main/resources/scenarios/ (voir docs/SIMULATION.md)
#  et choisissez-le dans la fenêtre qui s'ouvre au lancement (bouton Play).
#
#  Une clé absente de votre fichier garde la valeur d'ici.
#  Chaque valeur est vérifiée au démarrage : hors plage, la simulation
#  refuse de démarrer et dit quelle clé corriger.
# =====================================================================

# ---------------------------------------------------------------------
#  Hasard
# ---------------------------------------------------------------------

# Graine du hasard. Même graine = même ville et mêmes arrivées de clients.
# (L'ordre d'embarquement varie un peu d'une exécution à l'autre : les
# clients sont évalués en parallèle.)
seed = 42

# ---------------------------------------------------------------------
#  Ville (changer une de ces clés régénère la carte au prochain lancement)
# ---------------------------------------------------------------------

# Taille de l'espace virtuel, en pixels. Ratio conseillé 3:2.
# Plus grand = plus d'intersections, donc plus de nœuds.   [800 .. 4800]
city.width = 2274
# [600 .. 3200]
city.height = 1516

# Distance minimale entre deux intersections, en pixels.
# Plus petit = ville plus dense (beaucoup plus de nœuds).  [80 .. 400]
city.intersectionSpacing = 150

# Nombre de lignes de bus voulues. Si la ville est petite, le générateur
# peut en placer moins (il le signale au démarrage).       [1 .. 20]
city.busLines = 7

# ---------------------------------------------------------------------
#  Flotte
# ---------------------------------------------------------------------

# Bus par ligne. Le premier part d'un terminus, le deuxième de l'autre,
# les suivants sont répartis le long de la ligne.          [1 .. 10]
fleet.busesPerLine = 2

# Places assises par bus. Un bus plein affiche FULL et refuse les clients.
#                                                          [1 .. 100]
fleet.busCapacity = 5

# Nombre d'Uber. Chacun transporte un client à la fois.    [0 .. 100]
fleet.ubers = 5

# ---------------------------------------------------------------------
#  Clients
# ---------------------------------------------------------------------

# Débit de nouveaux clients, en clients par minute simulée, sur les ticks
# où des clients apparaissent (voir la clé suivante).      [0 .. 100]
customers.perMinute = 2

# Les clients n'apparaissent qu'un tick sur N ; les autres ticks sont sautés.
# Débit réel moyen = customers.perMinute / customers.spawnEveryTicks
# (ici 2 / 3 = environ 0,67 client par minute). 1 = à chaque tick. [1 .. 600]
customers.spawnEveryTicks = 3

# Multiplicateur appliqué par le bouton « Heure de pointe ». [1 .. 50]
customers.rushHourFactor = 10

# Part des clients qui vont à une FIN DE LIGNE (terminus). Aucun client
# n'apparaît à un terminus.                                [0 .. 1]
customers.terminusShare = 0.4

# Part des clients qui partent ou vont HORS du réseau de bus : sans marche
# à pied, ils prennent un Uber pour tout le trajet.        [0 .. 1]
customers.offNetworkShare = 0.15

# Attente estimée à une correspondance, en minutes simulées. Sert à
# planifier : plus elle est grande, plus les clients évitent de changer
# de ligne.                                                [0 .. 60]
customers.transferMinutes = 5

# ---------------------------------------------------------------------
#  Tarifs (en dollars)
# ---------------------------------------------------------------------

# Prix d'un trajet en bus, correspondances incluses.        [0 .. 50]
fares.bus = 3.50

# Course Uber : montant de base + prix par minute simulée dans la voiture.
#                                                          [0 .. 50]
fares.uberBase = 3.00
#                                                          [0 .. 10]
fares.uberPerMinute = 0.60

# ---------------------------------------------------------------------
#  Moteur
# ---------------------------------------------------------------------

# Ticks par seconde à la vitesse ×1 (1 tick = 1/10 de minute simulée).
# Les boutons ×4 et ×16 multiplient cette valeur.          [1 .. 200]
engine.ticksPerSecond = 20
